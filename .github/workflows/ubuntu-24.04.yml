name: Ubuntu 24.04

on:
  workflow_dispatch:

permissions:
  id-token: write

concurrency:
  group: ubuntu-24.04
  cancel-in-progress: true

jobs:
  rdp:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:github-actions

      - name: Configure RDP
        shell: bash
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          set -euo pipefail

          user='rdpuser'

          if [[ -z "$RDP_PASSWORD" ]]; then
            echo 'RDP_PASSWORD is not set.'
            exit 1
          fi

          docker run --name xfce-container \
            --privileged \
            --shm-size=2g \
            -p 3389:3389 \
            -d \
            ubuntu:24.04 \
            sleep infinity

          docker exec -i -e RDP_PASSWORD="$RDP_PASSWORD" xfce-container bash -s << 'EOF'
          set -euo pipefail
          user='rdpuser'

          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            xfce4 \
            xfce4-terminal \
            xfce4-notifyd \
            tango-icon-theme \
            xrdp \
            xorgxrdp \
            dbus-x11

          useradd \
            --create-home \
            --shell /bin/bash \
            "$user"

          printf '%s:%s\n' "$user" "$RDP_PASSWORD" | chpasswd

          usermod -aG sudo "$user"

          printf '%s\n' 'startxfce4' | tee "/home/$user/.xsession" >/dev/null
          chown "$user:$user" "/home/$user/.xsession"

          /etc/init.d/xrdp start
          EOF

          ip="$(tailscale ip -4)"

          if [[ -z "$ip" ]]; then
            echo 'Tailscale IPv4 address unavailable.'
            exit 1
          fi

          if ! docker exec xfce-container pgrep -x xrdp > /dev/null; then
            echo 'xrdp failed to start.'
            exit 1
          fi

          echo "RDP READY"
          echo "Address : $ip"
          echo "Username: $user"
          echo "Port    : 3389"
          echo "Connect : mstsc /v:$ip"

      - name: Keep alive
        shell: bash
        run: |
          sleep infinity
