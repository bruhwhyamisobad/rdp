name: Windows Server 2022

on:
  workflow_dispatch:

permissions:
  id-token: write

concurrency:
  group: windows-2022
  cancel-in-progress: true

jobs:
  rdp:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:github-actions

      - name: Configure RDP
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'

          $user = 'rdpuser'

          if (-not $env:RDP_PASSWORD) {
              throw 'RDP_PASSWORD is not set.'
          }

          $password = ConvertTo-SecureString `
              $env:RDP_PASSWORD `
              -AsPlainText `
              -Force

          New-LocalUser `
            -Name $user `
            -Password $password `
            -PasswordNeverExpires `
            -AccountNeverExpires `
            -UserMayNotChangePassword

          Add-LocalGroupMember `
            -Group 'Administrators' `
            -Member $user

          Set-ItemProperty `
            'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name fDenyTSConnections `
            -Value 0

          Set-ItemProperty `
            'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name UserAuthentication `
            -Value 1

          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'
          Start-Service -Name TermService

          $ip = tailscale ip -4

          if (-not $ip) {
              throw 'Tailscale IPv4 address unavailable.'
          }

          if ((Get-Service -Name TermService).Status -ne 'Running') {
              throw 'Remote Desktop Services is not running.'
          }

          Write-Host "RDP READY"
          Write-Host "Address : $ip"
          Write-Host "Username: $user"
          Write-Host "Port    : 3389"
          Write-Host "Connect : mstsc /v:$ip"

      - name: Keep alive
        shell: powershell
        run: |
          Wait-Event
